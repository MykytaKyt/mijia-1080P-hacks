## =====================================================================
##  Mijia 1080p hack configuration
##  Format: KEY=value, one per line. Lines starting with '#' are ignored.
##  Booleans: 1 = enabled, 0 = disabled.
##  Changes take effect on the next boot.
## =====================================================================

## --- Xiaomi cloud -----------------------------------------------------
## Cut the camera off from the Xiaomi cloud completely (Mi Home app will
## stop working). Stops miio_client, miio_agent, OTA, BLE and cloud video.
CLOUD_DISABLED=0
## Keep the Mi Home app working (settings, alerts) but stop sending video
## to the Xiaomi cloud / phone. Ignored when CLOUD_DISABLED=1.
CLOUD_STREAMING_DISABLED=0

## --- Local streaming (RTSP) ------------------------------------------
## Start the RTSP server. Stream URL: rtsp://<camera-ip>/live/ch00_0
RTSP_ENABLED=0
## Encoder options: -bBITRATE(kbps) -fFRAMERATE -wWIDTH -hHEIGHT -mBITRATEMODE
##   BITRATEMODE: 1 Constant, 2 Variable, 3 Enhanced Constant, 4 Enhanced Variable
CONFIG_LINE=-b4096 -f20 -w1920 -h1080 -m1
## Write RTSP server output to the SD card (logs/rtsp.log). Debugging only.
RTSP_LOG=0

## --- Access ----------------------------------------------------------
## Root password for SSH/SFTP, Samba and the web interface (user: root).
## Use at least 8 characters and CHANGE THE DEFAULT.
SSH_ROOT_PASS=qwerty123456
## Network hostname of the camera.
HOSTNAME=Valhalla

## --- Firmware updates ------------------------------------------------
## Block Xiaomi firmware (OTA) updates, which may remove this hack.
DISABLED_OTA=0

## --- Extra services --------------------------------------------------
## Web server on port 8080 (http://<camera-ip>:8080, user root).
## Recordings are browsable under /media.
HTTP_ENABLED=0
## Samba share "rec" with the recordings (user root).
SAMBA_ENABLED=0

## --- Language --------------------------------------------------------
## Replace the Chinese voice prompts with the English ones.
ENGLISH_VOICE=1

## --- Wi-Fi (optional) ------------------------------------------------
## Leave empty to keep the network configured through the Mi Home app.
## When set, the camera joins this network on boot.
miio_ssid=
miio_passwd=
## WPA for WPA/WPA2-PSK networks, NONE for open networks.
miio_key_mgmt=WPA
