# Wi-Fi setup page, served on the setup access point (http://192.168.14.1).
# Started by valhallad.sh only while the camera is in Wi-Fi setup mode.
# No login: the access point itself is protected by SETUP_AP_PASS.

server.port = 80
server.pid-file = "/var/run/lighttpd-setup.pid"
server.document-root = "/tmp/sd/tools/www/setup/"
server.upload-dirs = ( "/tmp/sd/tools/tmp/" )
server.errorlog = "/tmp/sd/tools/tmp/lighttpd-setup.log"
server.modules = ( "mod_cgi", "mod_redirect" )

# Send every unknown URL (phone connectivity checks) to the setup page.
url.redirect = ( "^/(?!index\.php|style\.css).+" => "/index.php" )

static-file.exclude-extensions = ( ".php", "~", ".inc" )
index-file.names = ( "index.php" )
cgi.assign = ( ".php" => "/tmp/sd/tools/bin/arm-php-cgi" )

mimetype.assign = (
    ".html" => "text/html",
    ".css" => "text/css" )
