# https://redmine.lighttpd.net/projects/lighttpd/wiki/Docs_ConfigurationOptions

server.port = 8080
server.pid-file = "/var/run/lighttpd.pid" 
# server.username = "www-data" 
# server.groupname = "www-data" 
server.document-root = "/tmp/sd/tools/www/" 
server.upload-dirs = ( "/tmp/sd/tools/tmp/" )
server.errorlog = "/tmp/sd/tools/tmp/lighttpd.log"
server.modules = ( "mod_cgi" )

# Login (user root, password SSH_ROOT_PASS from midgard.ini) is checked by
# the PHP pages themselves (lib/midgard.php, require_login): basic auth in
# this static lighttpd build rejects every password. Recordings are served
# through media.php for the same reason, never as a static directory.

static-file.exclude-extensions = (
    ".fcgi", ".php", ".rb", "~", ".inc" )

index-file.names = (
    "index.php", "index.html", "index.htm" )

cgi.assign = (
    ".php" => "/tmp/sd/tools/bin/arm-php-cgi" )

mimetype.assign = (
    ".html" => "text/html",
    ".css" => "text/css",
    ".htm" => "text/html", 
    ".txt" => "text/plain",
    ".mp4" => "video/mp4",
    ".jpg" => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".gif" => "image/gif",
    ".png" => "image/png")
	