name: Check and package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck (our scripts)
        run: |
          shellcheck -s sh -S warning -e SC3037,SC3045,SC1091 \
            sdcard/valhalla.sh sdcard/ft/ft_boot.sh \
            sdcard/tools/valhalla_lib.sh sdcard/tools/valhallad.sh \
            sdcard/tools/rtsp_start.sh sdcard/tools/inject.sh \
            sdcard/tools/post-ota.sh sdcard/tools/sign_ft_boot.sh

      - name: Shell syntax (all scripts, dash)
        run: for f in sdcard/*.sh sdcard/ft/*.sh sdcard/tools/*.sh; do dash -n "$f"; done

      - name: PHP syntax
        run: find sdcard/tools/www -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: ft_boot.sh signature matches
        run: |
          md5=$(md5sum sdcard/ft/ft_boot.sh | cut -d ' ' -f 1)
          openssl pkeyutl -decrypt -inkey sdcard/tools/prikey.pem -in sdcard/ft/secret.bin | grep -q "^$md5 " \
            || { echo "ft/secret.bin does not match ft/ft_boot.sh, run tools/sign_ft_boot.sh"; exit 1; }

      - name: Build SD card zip
        run: |
          cd sdcard
          zip -r -X ../mijia-1080p-sdcard.zip . -x 'logs/*' -x 'tf_recovery.img.bak' -x 'tools/dropbear/dropbear_*_host_key'

      - uses: actions/upload-artifact@v4
        with:
          name: mijia-1080p-sdcard
          path: mijia-1080p-sdcard.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mijia-1080p-sdcard.zip
          generate_release_notes: true
